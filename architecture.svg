<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="860" height="340" fill="#0f1420"/>
  <text x="30" y="42" fill="#e6edf3" font-size="20" font-weight="700">GraphRAG Security Agent — Request Flow</text>

  <!-- User -->
  <rect x="30" y="90" width="150" height="70" rx="10" fill="#1b2434" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="105" y="122" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="600">User</text>
  <text x="105" y="142" fill="#8b98a9" font-size="11" text-anchor="middle">plain-English question</text>

  <!-- Agent loop -->
  <rect x="240" y="70" width="220" height="200" rx="12" fill="#161f2e" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="350" y="98" fill="#e6edf3" font-size="14" text-anchor="middle" font-weight="700">Agent loop (agent.py)</text>
  <rect x="262" y="116" width="176" height="42" rx="8" fill="#1b2434"/>
  <text x="350" y="142" fill="#cbd5e1" font-size="11.5" text-anchor="middle">LLM picks a tool</text>
  <rect x="262" y="168" width="176" height="42" rx="8" fill="#1b2434"/>
  <text x="350" y="194" fill="#cbd5e1" font-size="11.5" text-anchor="middle">run tool, feed result back</text>
  <rect x="262" y="220" width="176" height="34" rx="8" fill="#1b2434"/>
  <text x="350" y="242" fill="#cbd5e1" font-size="11.5" text-anchor="middle">repeat until answer</text>

  <!-- Tools -->
  <rect x="520" y="80" width="150" height="70" rx="10" fill="#1b2434" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="595" y="108" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">Query tools</text>
  <text x="595" y="128" fill="#8b98a9" font-size="10.5" text-anchor="middle">graph_tools.py</text>

  <!-- Neo4j -->
  <rect x="520" y="190" width="150" height="70" rx="10" fill="#1b2434" stroke="#34d399" stroke-width="1.5"/>
  <text x="595" y="222" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">Neo4j</text>
  <text x="595" y="242" fill="#8b98a9" font-size="10.5" text-anchor="middle">attack-graph</text>

  <!-- Answer -->
  <rect x="710" y="90" width="120" height="70" rx="10" fill="#1b2434" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="770" y="118" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">Grounded</text>
  <text x="770" y="136" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="600">answer</text>
  <text x="770" y="153" fill="#8b98a9" font-size="10" text-anchor="middle">with citations</text>

  <!-- Arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="180" y1="125" x2="238" y2="130" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="460" y1="130" x2="518" y2="115" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="595" y1="150" x2="595" y2="188" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="518" y1="225" x2="470" y2="200" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="462" y1="150" x2="708" y2="120" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>
</svg>
